name: Update tool inputs

# Polls each forked guest-tool repo for its latest *release* (falling back to
# the newest tag, then default-branch HEAD), re-pins the matching flake input to
# that commit, and -- only if the new versions actually cross-build -- opens a
# single PR with the bumps. The PR is left for human review; merging it triggers
# the normal Build workflow and cuts the next penguin-tools release.

on:
  schedule:
    - cron: "0 6 * * *"   # nightly, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-inputs:
    runs-on: rehosting-arc
    env:
      USER: runner
      LOGNAME: runner
      TMPDIR: /home/runner/_work/_temp
      XDG_CACHE_HOME: /home/runner/_work/.cache
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner directories
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"

      - name: Install jq (used by the re-pin step)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up Nix (shared rehosting/ci action)
        uses: rehosting/ci/actions/nix-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-nix-config: |
            max-jobs = 8
            cores = 8
          cache-backend: cachix
          cachix-name: rehosting-tools
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          enable-kvm: "false"

      - name: Re-pin inputs to latest releases
        id: bump
        run: |
          set -uo pipefail
          # GitHub runs run-steps with `bash -e`; we deliberately handle failures
          # via empty-string checks (e.g. releases/latest 404s for release-less
          # repos like libhc, which then fall back to tag/HEAD), so disable -e.
          set +e
          api() {
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/$1"
          }

          # flake input name -> owner/repo it tracks
          declare -A REPOS=(
            [console]=rehosting/console
            [guesthopper]=rehosting/guesthopper
            [libnvram]=rehosting/libnvram
            [busybox]=rehosting/busybox
            [libhc]=panda-re/libhc
            [vpnguin]=rehosting/vpnguin
          )

          {
            echo "Automated input bump. Each input is re-pinned to the latest"
            echo "**release** of its repo (falling back to the newest tag, then"
            echo "default-branch HEAD). Opened only after an in-workflow"
            echo '`nix build .#dist` proved the new versions cross-build.'
            echo
            echo "| Input | Source | Ref | Old | New |"
            echo "|-------|--------|-----|-----|-----|"
          } > pr-body.md

          changed=0
          for name in "${!REPOS[@]}"; do
            slug="${REPOS[$name]}"; o="${slug%%/*}"; r="${slug##*/}"

            ref="$(api "repos/$o/$r/releases/latest" 2>/dev/null | jq -r '.tag_name // empty')"
            src="release"
            if [ -z "$ref" ]; then
              ref="$(api "repos/$o/$r/tags?per_page=1" | jq -r '.[0].name // empty')"; src="tag"
            fi
            if [ -z "$ref" ]; then
              ref="$(api "repos/$o/$r" | jq -r '.default_branch')"; src="HEAD"
            fi

            newsha="$(api "repos/$o/$r/commits/$ref" | jq -r '.sha // empty')"
            if [ -z "$newsha" ]; then
              echo "::warning::could not resolve a commit for $name ($slug)"; continue
            fi

            oldsha="$(grep -oE "github:$o/$r/[0-9a-f]+" flake.nix | head -1 | sed -E 's#.*/##')"
            if [ "$newsha" = "$oldsha" ]; then
              echo "$name up to date ($ref -> ${newsha:0:12})"; continue
            fi

            echo "bumping $name: ${oldsha:0:12} -> ${newsha:0:12} ($ref, $src)"
            sed -i -E "s#(github:$o/$r/)[0-9a-f]+#\1$newsha#" flake.nix
            nix flake update "$name"
            changed=1
            echo "| \`$name\` | $slug | \`$ref\` ($src) | \`${oldsha:0:12}\` | \`${newsha:0:12}\` |" >> pr-body.md
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Validate the bumped inputs
        if: steps.bump.outputs.changed == '1'
        run: nix build .#dist -L

      - name: Open update PR
        if: steps.bump.outputs.changed == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-inputs
          delete-branch: true
          title: "chore(deps): bump pinned tool inputs"
          commit-message: "chore(deps): bump pinned tool inputs to latest releases"
          body-path: pr-body.md
          add-paths: |
            flake.nix
            flake.lock
