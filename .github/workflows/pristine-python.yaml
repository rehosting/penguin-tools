name: Pristine Python Closure

# Builds a PRISTINE upstream-nixpkgs cross-compiled python3 (no penguin-tools
# ELF rewriting / dependency grafting) and uploads its runtime closure as a
# tarball artifact. Used to test whether the mips guest SIGSEGV is caused by
# penguin-tools' bundle machinery vs the emulator. Triggered on exp/** branch
# pushes and manual dispatch; does NOT touch main or publish a release.

on:
  push:
    branches:
      - 'exp/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pristine-python:
    runs-on: rehosting-arc
    env:
      USER: runner
      LOGNAME: runner
      TMPDIR: /home/runner/_work/_temp
      XDG_CACHE_HOME: /home/runner/_work/.cache
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner directories
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq xz-utils

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 8
            cores = 8
            extra-substituters = https://rehosting-tools.cachix.org
            extra-trusted-public-keys = rehosting-tools.cachix.org-1:iNKSaFwG7MfGn6Fk7oTmIcLHqfffQ+cQIE5gWc6MlY0=

      - name: Build pristine cross python3 closures (mipsel o32 + mips64el n64)
        run: |
          set -eux
          NP="github:NixOS/nixpkgs/b6067cc0127d4db9c26c79e4de0513e58d0c40c9"
          # mipsel (o32)
          nix build "${NP}#pkgsCross.mipsel-linux-gnu.python3" --out-link result-mipsel
          readlink -f result-mipsel | tee mipsel_python_store_path.txt
          tar -cf mipsel-python3-closure.tar $(nix-store -qR ./result-mipsel)
          # mips64el (n64 = gnuabi64) -- same ABI as penguin's crashing python
          nix build "${NP}#pkgsCross.mips64el-linux-gnuabi64.python3" --out-link result-mips64el
          readlink -f result-mips64el | tee mips64el_python_store_path.txt
          tar -cf mips64el-python3-closure.tar $(nix-store -qR ./result-mips64el)
          # mips64el MUSL (n64) -- pristine, no overlays/surgery (flake output) --
          # settles musl-vs-rewriting as the crash trigger.
          nix build ".#pristine-python-musl-mips64el" --out-link result-musl
          readlink -f result-musl | tee musl_mips64el_python_store_path.txt
          tar -cf musl-mips64el-python3-closure.tar $(nix-store -qR ./result-musl)
          ls -la *-python3-closure.tar

      - uses: actions/upload-artifact@v4
        with:
          name: pristine-python-closures
          path: |
            mipsel-python3-closure.tar
            mipsel_python_store_path.txt
            mips64el-python3-closure.tar
            mips64el_python_store_path.txt
            musl-mips64el-python3-closure.tar
            musl_mips64el_python_store_path.txt
          retention-days: 7
