name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: rehosting-arc
    env:
      USER: runner
      LOGNAME: runner
      TMPDIR: /home/runner/_work/_temp
      XDG_CACHE_HOME: /home/runner/_work/.cache
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner directories
        run: |
          set -eux
          mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"

      - name: Inspect runner storage
        run: |
          set -eux
          df -h / /home/runner/_work || true
          if [ -d /home/runner/_shared ]; then
            df -h /home/runner/_shared || true
            ls -ld /home/runner/_shared
          fi
          if [ -d /nix ]; then
            df -h /nix || true
            ls -ld /nix
          fi

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq xz-utils

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 8
            cores = 8
            keep-outputs = true
            keep-derivations = true

      - name: Configure Cachix
        uses: cachix/cachix-action@v16
        with:
          name: rehosting-tools
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Flake check
        run: nix flake check .

      - name: Build release artifact
        run: |
          set -eux
          nix build .#dist
          cp --dereference result penguin-tools.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: penguin-tools.tar.gz
          path: penguin-tools.tar.gz
          retention-days: 7

      - uses: reecetech/version-increment@2023.10.1
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: version
        with:
          use_api: true

      - name: Create release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.v-version }}
          release_name: Release ${{ steps.version.outputs.v-version }}
          body: Release ${{ steps.version.outputs.v-version }} @${{ github.ref_name }}
          draft: true
          prerelease: false

      - name: Upload release asset
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./penguin-tools.tar.gz
          asset_name: penguin-tools.tar.gz
          asset_content_type: application/gzip

      - name: Publish release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: StuYarrow/publish-release@v1.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ steps.create_release.outputs.id }}
